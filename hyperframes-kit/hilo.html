<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/hp.css" />
    <style>
      @font-face { font-family: "ZY Starry"; src: url("assets/fonts/ZY-Starry.ttf"); }
      .display { font-family: "ZY Starry", sans-serif; text-transform: none; line-height: 1.05; }
      .kicker { font-family: "Inter", sans-serif; font-weight: 600; letter-spacing: 0.08em; }
      .lift { text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35); }
      /* lower band: higher HRV recovers, lower HRV struggles */
      .row { position: absolute; left: 90px; width: 900px; }
      #hl-1 { top: 1110px; } #hl-2 { top: 1236px; }
      .lab { font-size: 24px; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7); }
      .res { position: absolute; right: 0; top: 0; font-size: 24px; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7); }
      .trk { margin-top: 12px; height: 40px; background: rgba(20, 18, 19, 0.45); border: 2px solid rgba(255, 255, 255, 0.85); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22); overflow: hidden; }
      .fill { height: 100%; transform-origin: left center; }
      #hl-1 .fill { width: 88%; background: var(--red); }
      #hl-2 .fill { width: 26%; background: rgba(255, 255, 255, 0.85); }
    </style>
  </head>
  <body>
    <div id="hilo" class="stage" data-composition-id="hilo" data-start="0" data-duration="7.8" data-width="1080" data-height="1920">
      <div id="hilo-g" class="clip" data-start="0" data-duration="7.8" data-track-index="0">
        <div class="row" id="hl-1"><div class="lab kicker">Higher HRV</div><div class="res kicker">Recovers better</div><div class="trk"><div class="fill"></div></div></div>
        <div class="row" id="hl-2"><div class="lab kicker">Lower HRV</div><div class="res kicker">Struggles with stress</div><div class="trk"><div class="fill"></div></div></div>
      </div>
    </div>
    <script>
      const C = /*CUES*/{"hi":0.3,"better":1.6,"lo":4.8,"harder":6.0,"out":7.5}/*END*/;
      const tl = gsap.timeline({ paused: true });
      gsap.set(".fill", { scaleX: 0 });
      gsap.set([".res", "#hl-2"], { opacity: 0 });
      tl.fromTo("#hl-1", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.02);
      tl.to("#hl-1 .fill", { scaleX: 1, duration: 0.6, ease: "power2.out" }, C.hi);
      tl.fromTo("#hl-1 .res", { opacity: 0, x: 12 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, C.better);
      // "the lower your HRV"
      tl.fromTo("#hl-2", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, C.lo - 0.2);
      tl.to("#hl-2 .fill", { scaleX: 1, duration: 0.5, ease: "power2.out" }, C.lo);
      tl.fromTo("#hl-2 .res", { opacity: 0, x: 12 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, C.harder);
      tl.to(["#hl-1", "#hl-2"], { opacity: 0, duration: 0.2, ease: "power2.in", stagger: 0.04 }, C.out);
      window.__timelines["hilo"] = tl;
      tl.seek(0);
</script>
  </body>
</html>
