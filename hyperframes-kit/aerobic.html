<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/hp.css" />
    <style>
      @font-face { font-family: "ZY Starry"; src: url("assets/fonts/ZY-Starry.ttf"); }
      .display { font-family: "ZY Starry", sans-serif; text-transform: none; line-height: 1.05; }
      .kicker { font-family: "Inter", sans-serif; font-weight: 600; letter-spacing: 0.08em; }
      .mono { font-family: "Inter", sans-serif; font-weight: 600; letter-spacing: 0.06em; }
      .lift { text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35); }
      /* aerobic: a long steady line ("long-term endurance"), then a battery that drains fast and barely refills */
      #ae-lab1 {
        position: absolute;
        left: 90px;
        top: 1112px;
        font-size: 24px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
      }
      #ae-line {
        position: absolute;
        left: 90px;
        top: 1160px;
        width: 900px;
        height: 140px;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.55));
      }
      #ae-batt {
        position: absolute;
        left: 90px;
        top: 1128px;
        width: 330px;
        height: 160px;
      }
      #ae-shell {
        position: absolute;
        left: 0;
        top: 0;
        width: 306px;
        height: 160px;
        border: 5px solid rgba(255, 255, 255, 0.9);
        border-radius: 18px;
        background: rgba(20, 18, 19, 0.4);
        display: flex;
        gap: 8px;
        padding: 12px;
      }
      #ae-nub {
        position: absolute;
        left: 306px;
        top: 50px;
        width: 20px;
        height: 60px;
        background: #ffffff;
        border-radius: 0 8px 8px 0;
      }
      .cell {
        flex: 1;
        background: #ffffff;
        border-radius: 4px;
      }
      #ae-k2 {
        position: absolute;
        left: 470px;
        top: 1136px;
        font-size: 22px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
      }
      .ae-big {
        position: absolute;
        left: 466px;
        top: 1176px;
        font-size: 56px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="aerobic" class="stage" data-composition-id="aerobic" data-start="0" data-duration="7.44" data-width="1080" data-height="1920">
      <div id="ae-g" class="clip" data-start="0" data-duration="7.44" data-track-index="0">
        <div id="ae-lab1" class="kicker">Long-term endurance</div>
        <svg id="ae-line" viewBox="0 0 900 140">
          <path id="ae-path" d="M4 70 C 80 30 120 110 200 70 S 330 30 410 70 S 540 110 620 70 S 760 34 896 66" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
          <circle id="ae-dot" cx="896" cy="66" r="13" fill="#ee2824" style="opacity:0" />
        </svg>
        <div id="ae-batt">
          <div id="ae-shell">
            <div class="cell" id="c1"></div><div class="cell" id="c2"></div><div class="cell" id="c3"></div>
            <div class="cell" id="c4"></div><div class="cell" id="c5"></div><div class="cell" id="c6"></div>
          </div>
          <div id="ae-nub"></div>
        </div>
        <div id="ae-k2" class="kicker">Weak engine</div>
        <div id="ae-b1" class="ae-big display lift">Out of energy</div>
        <div id="ae-k3" class="kicker" style="position:absolute;left:470px;top:1136px;font-size:22px;text-shadow:0 2px 12px rgba(0,0,0,.35)">Between efforts</div>
        <div id="ae-b2" class="ae-big display lift">Slow recovery</div>
      </div>
    </div>
    <script>
      const C = /*CUES*/{"weak":1.74,"fast":3.54,"recov":5.04,"out":7.14}/*END*/; // "If (weak)", "you run out", "and you're horrible"
      const path = document.getElementById("ae-path");
      const len = path.getTotalLength();
      const draw = Math.max(0.6, Math.min(1.3, C.weak - 0.45));
      const tl = gsap.timeline({ paused: true });
      gsap.set(path, { strokeDasharray: len, strokeDashoffset: len, opacity: 0 });
      gsap.set(["#ae-batt", "#ae-k2", "#ae-b1", "#ae-k3", "#ae-b2", "#ae-dot"], { opacity: 0 });
      // A: "long-term endurance" draws as one steady line
      tl.fromTo("#ae-lab1", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 0.05);
      tl.set(path, { opacity: 1 }, 0.1);
      tl.to(path, { strokeDashoffset: 0, duration: draw, ease: "power1.inOut" }, 0.1);
      tl.fromTo("#ae-dot", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 0.08 + draw);
      tl.to(["#ae-lab1", "#ae-line"], { opacity: 0, duration: 0.18, ease: "power2.in" }, C.weak - 0.16);
      // B: "if your aerobic capacity is weak, you run out of energy fast"
      tl.fromTo("#ae-batt", { opacity: 0, scale: 0.9, transformOrigin: "left center" }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, C.weak + 0.02);
      tl.fromTo("#ae-k2", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, C.weak + 0.12);
      tl.to(["#c6", "#c5", "#c4", "#c3", "#c2"], { opacity: 0.12, duration: 0.08, ease: "power2.in", stagger: 0.1 }, C.fast);
      tl.to("#c1", { backgroundColor: "#ee2824", duration: 0.12 }, C.fast + 0.42);
      tl.fromTo("#ae-b1", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, C.fast + 0.06);
            // C: "and you're horrible at recovering between efforts": barely one cell comes back
      tl.to(["#ae-b1", "#ae-k2"], { opacity: 0, duration: 0.15, ease: "power2.in" }, C.recov - 0.1);
      tl.fromTo("#ae-k3", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, C.recov + 0.04);
      tl.fromTo("#ae-b2", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, C.recov + 0.08);
      tl.to("#c2", { opacity: 1, backgroundColor: "#ee2824", duration: Math.max(0.6, Math.min(1.6, C.out - C.recov - 0.3)), ease: "none" }, C.recov + 0.26);
      tl.to(["#ae-batt", "#ae-k3", "#ae-b2"], { opacity: 0, duration: 0.18, ease: "power2.in" }, C.out + 0.02);
      window.__timelines["aerobic"] = tl;
      tl.seek(0);
</script>
  </body>
</html>
