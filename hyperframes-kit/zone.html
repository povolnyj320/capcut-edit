<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/hp.css" />
    <style>
      @font-face { font-family: "ZY Starry"; src: url("assets/fonts/ZY-Starry.ttf"); }
      .display { font-family: "ZY Starry", sans-serif; text-transform: none; line-height: 1.05; }
      .kicker { font-family: "Inter", sans-serif; font-weight: 600; letter-spacing: 0.08em; }
      .lift { text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35); }
      /* % of max heart rate scale: marker at threshold, then the training band */
      #z-lab { position: absolute; left: 90px; top: 1116px; font-size: 24px; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7); }
      #z-line { position: absolute; left: 90px; top: 1180px; width: 900px; height: 6px; background: #ffffff; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35); }
      .z-tick { position: absolute; top: 1200px; width: 80px; text-align: center; font-size: 22px; color: rgba(255, 255, 255, 0.85); text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7); }
      #z-band { position: absolute; left: 630px; top: 1160px; width: 90px; height: 46px; background: var(--red); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22); }
      #z-mark { position: absolute; left: 627px; top: 1150px; width: 6px; height: 66px; background: var(--red); }
      .z-big { position: absolute; left: 475px; top: 1246px; width: 400px; text-align: center; font-size: 64px; }
      #z-sub { position: absolute; left: 90px; top: 1270px; font-size: 24px; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7); }
    </style>
  </head>
  <body>
    <div id="zone" class="stage" data-composition-id="zone" data-start="0" data-duration="10.8" data-width="1080" data-height="1920">
      <div id="z-g" class="clip" data-start="0" data-duration="10.8" data-track-index="0">
        <div id="z-lab" class="kicker">% of max heart rate</div>
        <div id="z-band"></div>
        <div id="z-line"></div>
        <div id="z-mark"></div>
        <div class="z-tick kicker" style="left:50px">50</div>
        <div class="z-tick kicker" style="left:230px">60</div>
        <div class="z-tick kicker" style="left:410px">70</div>
        <div class="z-tick kicker" style="left:590px">80</div>
        <div class="z-tick kicker" style="left:770px">90</div>
        <div class="z-tick kicker" style="left:950px">100</div>
        <div id="z-80" class="z-big display lift">80%</div>
        <div id="z-85" class="z-big display lift">80-85%</div>
        <div id="z-sub" class="kicker">Long periods</div>
      </div>
    </div>
    <script>
      const C = /*CUES*/{"t80":2.0,"long":6.0,"band":7.5,"out":10.5}/*END*/;
      const tl = gsap.timeline({ paused: true });
      gsap.set(["#z-mark", "#z-80", "#z-85", "#z-sub"], { opacity: 0 });
      gsap.set("#z-band", { scaleX: 0, transformOrigin: "left center" });
      tl.fromTo("#z-lab", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 0.05);
      tl.fromTo("#z-line", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 0);
      tl.fromTo(".z-tick", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out", stagger: 0.05 }, 0.2);
      // "about 80% of your max heart rate": threshold marker lands
      tl.fromTo("#z-mark", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, C.t80);
      tl.fromTo("#z-80", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, C.t80 + 0.1);
      // "spend long periods of time at 80 to 85 percent"
      tl.fromTo("#z-sub", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, C.long);
      tl.to("#z-80", { opacity: 0, duration: 0.2, ease: "power2.in" }, C.band - 0.1);
      tl.to("#z-band", { scaleX: 1, duration: 0.5, ease: "power2.out" }, C.band);
      tl.fromTo("#z-85", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, C.band + 0.1);
      tl.to(["#z-lab", ".z-tick", "#z-85", "#z-sub", "#z-mark"], { opacity: 0, duration: 0.18, ease: "power2.in" }, C.out);
      tl.to(["#z-line", "#z-band"], { scaleX: 0, transformOrigin: "right center", duration: 0.22, ease: "power2.in" }, C.out + 0.04);
      window.__timelines["zone"] = tl;
      tl.seek(0);
</script>
  </body>
</html>
