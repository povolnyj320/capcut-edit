<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[{"id":"num","type":"string","label":"Number","default":"01"},{"id":"kicker","type":"string","label":"Kicker","default":"Pillar 01"},{"id":"name","type":"string","label":"Name","default":"Anaerobic Capacity"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/hp.css" />
    <style>
      @font-face { font-family: "ZY Starry"; src: url("assets/fonts/ZY-Starry.ttf"); }
      .display { font-family: "ZY Starry", sans-serif; text-transform: none; line-height: 1.05; }
      .kicker { font-family: "Inter", sans-serif; font-weight: 600; letter-spacing: 0.08em; }
      .mono { font-family: "Inter", sans-serif; font-weight: 600; letter-spacing: 0.06em; }
      .lift { text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35); }
      /* pillar card, lower band: outlined number that fills red when the name lands */
      #cd-num {
        position: absolute;
        left: 78px;
        top: 1104px;
        font-size: 150px;
        color: rgba(238, 40, 36, 0);
        -webkit-text-stroke: 3px #ffffff;
      }
      #cd-bar {
        position: absolute;
        left: 300px;
        top: 1146px;
        width: 690px;
        height: 160px;
        background: var(--red);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
      }
      #cd-kick {
        position: absolute;
        left: 330px;
        top: 1164px;
        font-size: 22px;
      }
      #cd-name {
        position: absolute;
        left: 328px;
        top: 1200px;
        font-size: 58px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="card" class="stage" data-composition-id="card" data-start="0" data-duration="3.8" data-width="1080" data-height="1920">
      <div id="cd-g" class="clip" data-start="0" data-duration="3.8" data-track-index="0">
        <div id="cd-bar"></div>
        <div id="cd-num" class="display" data-var-text="num">01</div>
        <div id="cd-kick" class="kicker" data-var-text="kicker">Pillar 01</div>
        <div id="cd-name" class="display lift" data-var-text="name">Anaerobic Capacity</div>
      </div>
    </div>
    <script>
      const C = /*CUES*/{"reveal":0.22,"out":2.0}/*END*/; // "reveal" = the word that names the pillar
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#cd-num", { x: -16, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0);
      tl.fromTo("#cd-bar", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 0.06);
      tl.fromTo("#cd-kick", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 0.2);
      // the name lands on the word, and the number floods red with it
      tl.fromTo("#cd-name", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, C.reveal);
      tl.to("#cd-num", { color: "rgba(238,40,36,1)", duration: 0.25, ease: "power2.out" }, C.reveal);
      tl.to(["#cd-name", "#cd-kick"], { opacity: 0, duration: 0.15, ease: "power2.in" }, C.out);
      tl.to("#cd-bar", { scaleX: 0, transformOrigin: "right center", duration: 0.22, ease: "power2.in" }, C.out + 0.06);
      tl.to("#cd-num", { opacity: 0, duration: 0.25, ease: "power2.in" }, C.out + 0.04);
      window.__timelines["card"] = tl;
      tl.seek(0);
</script>
  </body>
</html>
