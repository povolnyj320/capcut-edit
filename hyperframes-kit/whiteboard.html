<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/wb.js"></script>
    <link rel="stylesheet" href="assets/hp.css" />
    <style>
      @font-face {
        font-family: "ZY Starry";
        src: url("assets/fonts/ZY-Starry.ttf");
      }
      /* HP whiteboard cutaway (merged style, Oct 28). Plays the EDL's "scenes" list with the scenes in
         assets/wb.js. Opaque, full screen: render with "format": "mp4" on lane -1. */
      html,
      body {
        background: #f3f3f3;
      }
      .wb-title {
        font-family: "ZY Starry", sans-serif;
        line-height: 1.05;
        color: #231f20;
      }
      .wb-label {
        font-family: "Helvetica Neue", Helvetica, sans-serif;
        font-weight: 600;
        letter-spacing: 0.08em;
        line-height: 1.35;
        text-transform: uppercase;
        color: #9a9a9a;
      }
      .wb-tick {
        width: 70px;
        text-align: right;
        font-family: "Helvetica Neue", Helvetica, sans-serif;
        font-weight: 500;
        font-size: 24px;
        color: #a0a0a0;
      }
      .wb-foot {
        font-family: "Helvetica Neue", Helvetica, sans-serif;
        font-style: italic;
        font-weight: 300;
        font-size: 30px;
        color: #9a9a9a;
      }
      .r {
        color: #ee2824;
      }
    </style>
  </head>
  <body>
    <div id="whiteboard" class="stage" data-composition-id="whiteboard" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <div id="wb-g" class="clip" data-start="0" data-duration="10" data-track-index="0"></div>
    </div>
    <script>
      const SCENES = /*SCENES*/[];
      const C = /*CUES*/{"out":0}/*END*/;
      const tl = gsap.timeline({ paused: true });
      WB.init(document.getElementById("wb-g"), tl);
      WB.play(SCENES);
      window.__timelines["whiteboard"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
