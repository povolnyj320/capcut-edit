<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[{"id":"i1","type":"string","label":"Item 1","default":"Bicycle hours"},{"id":"i2","type":"string","label":"Item 2","default":"Mostly easy"},{"id":"i3","type":"string","label":"Item 3","default":"Cut processed sugar"},{"id":"i4","type":"string","label":"Item 4","default":"Stay fresh in season"},{"id":"i5","type":"string","label":"Item 5","default":"Black out"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/hp.css" />
    <style>
      @font-face { font-family: "ZY Starry"; src: url("assets/fonts/ZY-Starry.ttf"); }
      .display { font-family: "ZY Starry", sans-serif; text-transform: none; line-height: 1.05; }
      .lift { text-shadow: 0 2px 14px rgba(0, 0, 0, 0.5); }
      /* five-line list in the open space he points at (Jett Top 5, Oct 29: up and to his right, screen left).
         Move it with "css" in the EDL: .clip{translate:x y} */
      #tk-list { position: absolute; left: 70px; top: 520px; }
      .tk-row { display: flex; align-items: baseline; height: 104px; white-space: nowrap; }
      .tk-num { width: 70px; font-size: 64px; color: var(--red); }
      .tk-name { font-size: 54px; color: #ffffff; }
    </style>
  </head>
  <body>
    <div id="takeaways" class="stage" data-composition-id="takeaways" data-start="0" data-duration="3.0" data-width="1080" data-height="1920">
      <div id="tk-g" class="clip" data-start="0" data-duration="3.0" data-track-index="0">
        <div id="tk-list">
          <div class="tk-row" id="tk1"><span class="tk-num display lift">5</span><span class="tk-name display lift" data-var-text="i1">Bicycle hours</span></div>
          <div class="tk-row" id="tk2"><span class="tk-num display lift">4</span><span class="tk-name display lift" data-var-text="i2">Mostly easy</span></div>
          <div class="tk-row" id="tk3"><span class="tk-num display lift">3</span><span class="tk-name display lift" data-var-text="i3">Cut processed sugar</span></div>
          <div class="tk-row" id="tk4"><span class="tk-num display lift">2</span><span class="tk-name display lift" data-var-text="i4">Stay fresh in season</span></div>
          <div class="tk-row" id="tk5"><span class="tk-num display lift">1</span><span class="tk-name display lift" data-var-text="i5">Black out</span></div>
        </div>
      </div>
    </div>
    <script>
      // one row lands on each cue, top to bottom; they all leave together on "out"
      const C = /*CUES*/{"r1":0.1,"r2":0.4,"r3":0.7,"r4":1.0,"r5":1.3,"out":2.7}/*END*/;
      const tl = gsap.timeline({ paused: true });
      gsap.set(".tk-row", { opacity: 0, x: -24 });
      ["r1", "r2", "r3", "r4", "r5"].forEach((k, i) => {
        tl.to("#tk" + (i + 1), { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, C[k]);
      });
      tl.to(".tk-row", { opacity: 0, x: -16, duration: 0.2, stagger: 0.03, ease: "power2.in" }, C.out);
      window.__timelines["takeaways"] = tl;
      tl.seek(0);
</script>
  </body>
</html>
