<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/hp.css" />
    <style>
      @font-face { font-family: "ZY Starry"; src: url("assets/fonts/ZY-Starry.ttf"); }
      .display { font-family: "ZY Starry", sans-serif; text-transform: none; line-height: 1.05; }
      .kicker { font-family: "Inter", sans-serif; font-weight: 600; letter-spacing: 0.08em; }
      .lift { text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35); }
      /* top band: the myth, then struck and replaced by the truth */
      .tag { position: absolute; left: 90px; top: 196px; padding: 8px 16px 6px; font-size: 24px; }
      #my-tag { background: var(--red); }
      #my-tru { background: #ffffff; color: var(--dark); }
      #my-title { position: absolute; left: 86px; top: 236px; font-size: 72px; }
      .strike { position: absolute; left: 80px; height: 8px; background: var(--red); }
      #my-s1 { top: 274px; width: 380px; }
      #my-s2 { top: 350px; width: 350px; }
      #my-truth { position: absolute; left: 86px; top: 250px; font-size: 56px; white-space: nowrap; }
      #my-rule { position: absolute; left: 90px; top: 402px; width: 420px; height: 8px; background: var(--red); }
      #my-ten { position: absolute; left: 90px; top: 428px; font-size: 26px; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7); }
    </style>
  </head>
  <body>
    <div id="myth" class="stage" data-composition-id="myth" data-start="0" data-duration="11.0" data-width="1080" data-height="1920">
      <div id="myth-g" class="clip" data-start="0" data-duration="11.0" data-track-index="0">
        <div id="my-tag" class="tag kicker">Myth</div>
        <div id="my-tru" class="tag kicker">Truth</div>
        <div id="my-title" class="display lift">Train like<br />you ride?</div>
        <div id="my-s1" class="strike"></div>
        <div id="my-s2" class="strike"></div>
        <div id="my-truth" class="display lift">Don't bring moto into the gym</div>
        <div id="my-rule"></div>
        <div id="my-ten" class="kicker">"10 times faster"</div>
      </div>
    </div>
    <script>
      const C = /*CUES*/{"ten":7.5,"truth":9.3,"out":10.7}/*END*/;
      const tl = gsap.timeline({ paused: true });
      gsap.set(["#my-tru", "#my-truth", "#my-ten"], { opacity: 0 });
      gsap.set(".strike", { scaleX: 0, transformOrigin: "left center" });
      tl.fromTo("#my-title", { opacity: 0.85 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);
      tl.fromTo("#my-tag", { x: -24 }, { x: 0, duration: 0.5, ease: "power2.out" }, 0);
      tl.fromTo("#my-rule", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.7, ease: "power2.out" }, 0.1);
      // "10 times faster on your bike"
      tl.fromTo("#my-ten", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, C.ten);
      // "Do not bring motocross into the gym": strike the myth, swap in the truth
      tl.to(".strike", { scaleX: 1, duration: 0.35, ease: "power2.out", stagger: 0.12 }, C.truth - 0.3);
      tl.to(["#my-title", ".strike", "#my-tag", "#my-ten"], { opacity: 0, duration: 0.25, ease: "power2.in" }, C.truth + 0.3);
      tl.fromTo("#my-tru", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, C.truth + 0.45);
      tl.fromTo("#my-truth", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, C.truth + 0.5);
      tl.to(["#my-tru", "#my-truth"], { opacity: 0, duration: 0.2, ease: "power2.in" }, C.out);
      tl.fromTo("#my-rule", { y: 0 }, { y: -40, duration: 0.4, ease: "power2.out" }, C.truth + 0.3);
      tl.to("#my-rule", { scaleX: 0, transformOrigin: "right center", duration: 0.2, ease: "power2.in" }, C.out);
      window.__timelines["myth"] = tl;
      tl.seek(0);
</script>
  </body>
</html>
